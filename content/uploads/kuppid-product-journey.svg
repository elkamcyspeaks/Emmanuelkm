<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f4f0ff"/><text x="65" y="80" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#241e35">A connection needs a clear next step</text><text x="65" y="125" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">The member journey</text><rect x="65" y="190" width="310" height="275" rx="20" fill="#fff"/><text x="90" y="245" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#7551ef">01</text><text x="90" y="300" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#241e35">Join</text><text x="90" y="355" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">Confirm email</text><text x="90" y="400" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">Complete profile</text><rect x="395" y="190" width="310" height="275" rx="20" fill="#fff"/><text x="420" y="245" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#7551ef">02</text><text x="420" y="300" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#241e35">Discover</text><text x="420" y="355" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">Set preferences</text><text x="420" y="400" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">Explore people</text><rect x="725" y="190" width="310" height="275" rx="20" fill="#fff"/><text x="750" y="245" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#7551ef">03</text><text x="750" y="300" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#241e35">Match</text><text x="750" y="355" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">Send a like</text><text x="750" y="400" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">Mutual interest</text><rect x="1055" y="190" width="310" height="275" rx="20" fill="#fff"/><text x="1080" y="245" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#7551ef">04</text><text x="1080" y="300" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#241e35">Connect</text><text x="1080" y="355" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">Read and reply</text><text x="1080" y="400" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#655d75">Manage boundaries</text><text x="65" y="560" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#241e35">Each stage has a recovery path</text><rect x="65" y="600" width="1310" height="210" rx="20" fill="white"/><text x="100" y="655" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#655d75">Profile incomplete → explain what is missing and how to continue.</text><text x="100" y="707" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#655d75">No more profiles → check preferences or return as the community grows.</text><text x="100" y="759" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#655d75">Uncomfortable conversation → unmatch, block, report or contact support.</text></svg>